name: Save Diner recipes
 
on:
  repository_dispatch:
    types: [recipes]
 
permissions:
  contents: write
 
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Write recipes.json
        env:
          RECIPES: ${{ toJson(github.event.client_payload.recipes) }}
        run: printf '%s' "$RECIPES" > recipes.json
 
      - name: Save it to the repo
        run: |
          git config user.name "Base Camp Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Diner recipes"
          git pull --rebase
          git push
